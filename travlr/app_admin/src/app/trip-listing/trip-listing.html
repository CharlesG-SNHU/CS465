@if (isLoggedIn()) {
  <button type="button" class="btn btn-primary mb-3" (click)="addTrip()">Add Trip</button>
}

<div class="row">
  @for (trip of trips(); track trip.code) {
    <div class="col-md-4 mb-4">
      <app-trip-card [trip]="trip" class="card-deck mt-2"></app-trip-card>
    </div>
  }
</div>
